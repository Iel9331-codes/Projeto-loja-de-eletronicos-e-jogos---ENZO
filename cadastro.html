<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    ,<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <img src="img/logo.jpg" alt="Logo da loja" width="300">
    <h2>Cadastro de produtos Zé Games e eletrônicos</h2>
    <form action="#" method="post">
        <p>
        <label for="nome-produto">Nome do produto:</label><br>
        <input type="text" id="nome-produto" name="nome_produto" required>
        </p>
        <p>
        <label for="preco">Preço (R$):</label><br>
        <input type="number" id="preco" name="preco" step="0.01" required>
        </p>
        <p>
        <label for="descricao">Descrição do produto:</label><br>
        <textarea id="descricao" name="descricao" rows="3" required></textarea>
        </p>
        <p>
        <label for="categoria">Categoria do produto:</label><br>
        <select id="categoria" name="categoria" required>
            <option value="jogos">Jogos</option>
            <option value="consoles">Consoles</option>
            <option value="celulares">Celulares</option>
            <option value="notebooks">Notebooks</option>
            <option value="acessorios">Acessórios</option>
            </select>
        </p>
        <button type="submit">Cadastrar produto</button>
    </form>
</body>
</html>
